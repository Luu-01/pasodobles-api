<div class="d-flex align-items-center mb-4">
  <a routerLink="/admin/pasodobles" class="btn btn-light rounded-circle p-2 me-3 shadow-sm text-secondary hover-text-blue" style="width: 40px; height: 40px;">
    <i class="bi bi-arrow-left fs-5"></i>
  </a>
  <div>
    <!-- Título dinámico: si existe un ID será "Editar", si no, "Nuevo" -->
    <h3 class="fw-bold text-dark mb-0">{{ isEditMode ? 'Editar Pasodoble' : 'Nuevo Pasodoble' }}</h3>
    <p class="text-muted small mt-1">Completa los datos de la obra musical</p>
  </div>
</div>

<form [formGroup]="pasodoble" (ngSubmit)="save()">
  <div class="row g-4">
    <div class="col-12 col-lg-8">
      <div class="card card-minimal border-0 p-4 p-md-5">
        
        <div class="row g-4 mb-4">
          <div class="col-md-8">
            <label class="form-label text-muted small fw-bold text-uppercase letter-spacing-tight">Título de la Obra</label>
            <input type="text" class="form-control form-control-minimal" placeholder="Ej: Suspiros de España" formControlName="title">
          </div>
          
          <div class="col-md-4">
            <label class="form-label text-muted small fw-bold text-uppercase letter-spacing-tight">Año</label>
            <input type="number" class="form-control form-control-minimal" placeholder="Ej: 1902" formControlName="year">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-muted small fw-bold text-uppercase letter-spacing-tight">Dedicatoria e Historia</label>
          <textarea class="form-control form-control-minimal" rows="4" placeholder="Escribe aquí el contexto de la obra o a quién está dedicada..." formControlName="description"></textarea>
        </div>

        <div class="mb-2">
          <label class="form-label text-muted small fw-bold text-uppercase letter-spacing-tight">Enlace a Partitura (PDF)</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0 text-muted ps-3 rounded-start-4">
              <i class="bi bi-link-45deg"></i>
            </span>
            <input type="url" class="form-control form-control-minimal border-start-0 rounded-end-4 ps-1" placeholder="https://ejemplo.com/partitura.pdf" formControlName="pdf_url">
          </div>
        </div>

      </div>
    </div>

    <div class="col-12 col-lg-4">
      <div class="card card-minimal border-0 p-4 mb-4">
        <h6 class="fw-bold text-dark text-uppercase letter-spacing-tight mb-4 border-bottom pb-2">Clasificación</h6>
        
        <div class="mb-4">
          <label class="form-label text-muted small fw-bold">Compositor</label>
          <select class="form-select form-select-minimal" formControlName="author_id">
            <option value="">Selecciona un autor...</option>
            @for (author of authors; track author.id) { 
              <option [value]="author.id">{{ author.name }}</option> 
            }
          </select>
        </div>

        <div class="mb-2">
          <label class="form-label text-muted small fw-bold">Categoría</label>
          <select class="form-select form-select-minimal" formControlName="category_id">
            <option value="">Selecciona categoría...</option>
            <option value="1">Torero</option>
            <option value="2">De Concierto</option>
            <option value="3">Festero</option>
            <option value="4">Regional</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn text-white w-100 rounded-pill py-3 fw-medium shadow-sm mb-3" style="background-color: var(--paso-purple); transition: all 0.3s ease;">
        <i class="bi bi-save me-2">Guardar Pasodoble</i>
      </button>
      
      <a routerLink="/admin/pasodobles" class="btn btn-outline-secondary w-100 rounded-pill py-2">
        Cancelar
      </a>
    </div>
  </div>
</form>
