<div class="admin-wrapper d-flex min-vh-100 bg-light">
  
  <aside class="sidebar d-flex flex-column p-3 d-none d-md-flex border-end bg-white" style="width: 240px;">
    <a routerLink="/admin" class="text-decoration-none fs-5 fw-bold mb-4 letter-spacing-tight text-center">
      <span class="text-blue">Admin</span><span class="text-dark">Panel</span>
    </a>

    <ul class="nav nav-pills flex-column mb-auto gap-1">
      <li class="nav-item">
        <a routerLink="/admin/pasodobles" routerLinkActive="active-sidebar-link border-start border-3 border-primary" class="nav-link sidebar-link d-flex align-items-center rounded-0 py-2 px-3 text-dark small">
          <i class="me-2 text-muted"></i> Pasodobles
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/admin/compositores"  class="nav-link sidebar-link d-flex align-items-center rounded-0 py-2 px-3 text-dark small">
          <i class="me-2 text-muted"></i> Compositores
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/admin/archive-requests"  class="nav-link sidebar-link d-flex align-items-center rounded-0 py-2 px-3 text-dark small">
          <i class="me-2 text-muted"></i> Solicitudes
        </a>
      </li>
    </ul>

    <hr class="border-secondary opacity-25 my-3">

    <div class="mt-auto mb-5">
      <a routerLink="/pasodobles" class="btn btn-light w-100 rounded-0 mb-2 py-1 border small text-start px-3 text-muted">
        <i class="me-2"></i> Ver Web
      </a>
      
      @if(authService.currentUser$ | async; as user){
        <a (click)="authService.logout()" class="btn btn-light text-danger w-100 rounded-0 py-1 btn-logout border small text-start px-3">
          <i class="bi bi-power me-2"></i> Cerrar Sesión
        </a>
      }
      @else {
       <a routerLink="/auth/login" class="btn rounded-0 px-3 py-1 fw-medium d-flex align-items-center justify-content-center border-0 small w-100" style="background-color: var(--paso-purple); color: white;">
          <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
        </a>
      }
    </div>
  </aside>

  <div class="main-content flex-grow-1 d-flex flex-column">
    
    <header class="topbar px-4 py-2 d-flex justify-content-between align-items-center border-bottom shadow-sm">
      <div>
        <h6 class="mb-0 text-light fw-semibold d-none d-md-block" style="font-size: 0.9rem;">Panel de Control</h6>
      </div>

      <div class="d-flex align-items-center gap-3">
        @if(authService.currentUser$ | async; as user){
          <div class="text-end d-none d-sm-block">
            <a class="mb-0 text-light fw-medium lh-1" style="font-size: 0.85rem;" routerLink="/auth/user">{{ user.name }}</a>
            <p class="text-light" style="font-size: 0.7rem;">{{ user.email }}</p>
          </div>
          <button (click)="authService.logout()" class="btn btn-light rounded-0 px-3 py-1 d-flex align-items-center text-muted">
            <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
          </button>
        }
      </div>
    </header>

    <main class="content-area p-3 p-md-4 flex-grow-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
