<nav class="navbar navbar-expand-lg navbar-dark-custom py-3 mb-5 sticky-top" data-bs-theme="dark">
  <div class="container">
    
    <a class="navbar-brand fw-bold fs-3 letter-spacing-tight" routerLink="/pasodobles">
      <span class="text-gray">Pasodobles</span>
    </a>

    <!-- Responsive para móvil -->
    <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPrincipal" aria-controls="navbarPrincipal" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarPrincipal">
      
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-2 gap-lg-4">
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="/pasodobles" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">
            Archivo Musical
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="/authors" routerLinkActive="active-link">
            Compositores
          </a>
        </li>
        @if(authService.currentUser$ | async; as user){
          @if(user.role == 'admin'){
            <li class="nav-item">
              <a class="nav-link nav-link-custom" routerLink="/admin/pasodobles" routerLinkActive="active-link">
              Admin Panel
              </a>
          </li>
          }
        }
      </ul>

      <div class="d-flex align-items-center gap-3">
        @if(authService.currentUser$ | async; as user){
          <div class="text-end d-none d-sm-block">
            <p class="mb-0 text-white fw-medium lh-1">{{ user.name }}</p>
            <small class="text-muted" style="font-size: 0.75rem;">{{ user.email }}</small>
          </div>
          <!-- icon -->
          <div class="bg-gradient-custom rounded-circle d-flex align-items-center justify-content-center text-white shadow-sm" style="width: 42px; height: 42px;">
            <i class="bi bi-person-fill fs-5"></i>
          </div>
          <a (click)="authService.logout()" style="cursor: pointer;" class="btn rounded-pill px-4 py-2 fw-medium shadow-sm d-flex align-items-center" style="background-color: var(--paso-purple); color: white; transition: all 0.3s ease;">
            <i class="bi bi-box-arrow-right me-2 fs-5"></i> Cerrar Sesión
          </a>
        }
        @else {
          <a routerLink="/auth/login" class="btn rounded-pill px-4 py-2 fw-medium shadow-sm d-flex align-items-center" style="background-color: var(--paso-purple); color: white; transition: all 0.3s ease;">
            <i class="bi bi-box-arrow-in-right me-2 fs-5">Iniciar Sesión</i> 
          </a>
        }
      </div>
    </div>
  </div>
</nav>
<main class="container pb-5">
  <router-outlet></router-outlet>
</main>
