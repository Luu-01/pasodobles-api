<nav class="navbar navbar-expand-lg navbar-dark-custom py-2 mb-4 sticky-top" data-bs-theme="dark">
  <div class="container-fluid px-4">
    
    <a class="navbar-brand fw-semibold fs-5 letter-spacing-tight" routerLink="/pasodobles">
      <span class="text-white">Pasodobles</span>
    </a>

    <div class="collapse navbar-collapse" id="navbarPrincipal">
      
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="/pasodobles" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">
            Archivo Musical
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="/authors" routerLinkActive="active-link">
            Compositores
          </a>
        </li>
        @if(authService.currentUser$ | async; as user){
          @if(user.role == 'admin'){
            <li class="nav-item">
              <a class="nav-link nav-link-custom" routerLink="/admin/pasodobles" routerLinkActive="active-link">
              Admin Panel
              </a>
          </li>
          }
        }
      </ul>

      <div class="d-flex align-items-center gap-3">
        @if(authService.currentUser$ | async; as user){
          <div class="text-end d-none d-sm-block">
            <p class="mb-0 text-white fw-medium lh-1" style="font-size: 0.85rem;">{{ user.name }}</p>
            <small class="text-secondary" style="font-size: 0.7rem;">{{ user.email }}</small>
          </div>
          <button (click)="authService.logout()" class="btn-auth btn rounded-0 px-3 py-1 d-flex align-items-center">
            <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
          </button>
        }
        @else {
          <a routerLink="/auth/login" class="btn-auth btn rounded-0 px-3 py-1 d-flex align-items-center">
            <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
          </a>
        }
      </div>
    </div>
  </div>
</nav>

<main class="container px-4 pb-5">
  <router-outlet></router-outlet>
</main>
