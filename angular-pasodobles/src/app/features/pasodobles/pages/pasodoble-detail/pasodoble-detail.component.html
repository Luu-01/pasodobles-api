@if (pasodoble) {
  <div class="row justify-content-center mt-3">
    <div class="col-md-8">
      
      <div class="card card-minimal p-4 p-md-5">
        <div class="d-flex justify-content-between align-items-start mb-4">
          <div>
            <h2 class="display-5 fw-bold text-blue mb-0">{{ pasodoble.title }}</h2>
          </div>

          <span class="badge badge-purple mb-3 px-3 py-2 rounded-pill">{{ pasodoble.category }}</span>
          <span class="badge bg-light text-secondary border fs-6 mt-2">{{ pasodoble.year || 'Año N/D' }}</span>
        </div>

        <div class="p-4 rounded-4 border-start border-3 mb-5" style="border-color: var(--paso-blue);">
          <h6 class="fw-bold text-dark text-uppercase letter-spacing-1 small mb-3">Dedicatoria e Historia</h6>
          <p class="mb-0 text-secondary fs-5">
            {{ pasodoble.description }}
          </p>
        </div>

        <hr class="opacity-10 mb-4">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4">
          <div>
            <p class="text-muted mb-1 small text-uppercase fw-bold letter-spacing-1">Compositor</p>
            <a [routerLink]="['/authors', pasodoble.author_id]" class="text-decoration-none fs-4 fw-medium text-dark hover-text-purple d-flex align-items-center">
              {{ pasodoble.author?.name || 'Autor Desconocido' }}
            </a>
          </div>

          @if (pasodoble.pdf_url) {
            <a [href]="pasodoble.pdf_url" target="_blank" class="btn text-white rounded-pill px-4 py-2" style="background-color: var(--paso-blue);">
              <i class="bi bi-file-earmark-pdf me-2"></i> Ver Partitura
            </a>
          }
        </div>
      </div>      
      
      <div class="text-center mt-5 mb-5">
        <a routerLink="/pasodobles" class="text-muted text-decoration-none hover-text-blue">&larr; Volver al archivo</a>
      </div>

    </div>
  </div>
} @else {
  <div class="text-center py-5 mt-5">
    <div class="spinner-border text-purple" role="status"></div>
  </div>
}
